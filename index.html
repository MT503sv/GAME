<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Batalla</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game">
        <div id="status">
            <h1>Batalla</h1>
            <img src="" alt="Jugador" id="player-image">
            <p id="player-stats">Jugador: HP 100</p>
            <img src="Sprites/R.gif" alt="Enemigo" id="enemy-image">
            <p id="enemy-stats">Enemigo: HP 100</p>
        </div>
        <div id="actions">
            <button id="attack">Atacar</button>
            <button id="defend">Defender</button>
            <button id="use-item">Usar Objeto</button>
            <button id="equip-weapon">Equipar Arma</button>
        </div>
        <div id="message">
            <p id="log">El combate empieza!</p>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
